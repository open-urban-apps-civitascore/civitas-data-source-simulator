{{- $name := include "simulator.generatorName" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "simulator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.generator.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "simulator.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        # Numeric, not the image's user NAME: kubelet refuses to start a
        # container whose non-root claim it cannot verify, and `USER node`
        # in the Dockerfile tells it nothing it can check.
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: generator
          image: "{{ .Values.generator.image.repository }}:{{ .Values.generator.image.tag }}"
          imagePullPolicy: {{ .Values.generator.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.generator.service.port }}
          env:
            - name: PORT
              value: {{ .Values.generator.service.port | quote }}
            - name: TZ
              value: {{ .Values.generator.timezone | quote }}
            {{- if .Values.generator.auth.disabled }}
            # Emergency switch: no token is checked on any request.
            - name: SIMULATOR_AUTH_DISABLED
              value: "1"
            {{- else }}
            - name: AUTH_ISSUER_URL
              value: {{ required "generator.auth.issuerUrl is required unless generator.auth.disabled is true" .Values.generator.auth.issuerUrl | quote }}
            {{- end }}
            {{- with .Values.generator.auth.requiredRole }}
            - name: AUTH_REQUIRED_ROLE
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.database.enabled }}
            # BEFORE the DSN that reads it: the kubelet expands $(VAR) only
            # against variables declared EARLIER in this list. Declared after,
            # the reference survives verbatim into the connection string and
            # the generator authenticates with the literal "$(DEMO_DB_PASSWORD)".
            - name: DEMO_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.auth.existingSecret.secretName }}
                  key: {{ .Values.database.auth.existingSecret.key }}
            - name: DEMO_DB_DSN
              value: "postgres://{{ .Values.database.auth.username }}:$(DEMO_DB_PASSWORD)@{{ include "simulator.databaseName" . }}.{{ include "simulator.namespace" . }}.svc.cluster.local:{{ .Values.database.service.port }}/{{ .Values.database.auth.database }}"
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.generator.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "simulator.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: {{ .Values.generator.service.port }}
      targetPort: http
