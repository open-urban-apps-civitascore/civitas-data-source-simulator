# Mosquitto configuration for the demo data generator.
#
# This broker exists ONLY so simulated data has somewhere to go. It is deliberately
# not offered as messaging infrastructure for real sensors — a municipality has its
# own, with security, retention and availability requirements we do not want to own.
# That is why anonymous access below is acceptable rather than negligent.
#
# Going live means repointing the use case's datasource at the municipality's broker.
# The payload shape does not change, so nothing else has to.

listener 1883

# No auth: nothing here is real data, and the broker is reachable only from inside
# the platform network. If this ever carries anything but simulated readings, that
# assumption is broken and this line must change.
allow_anonymous true

# Nothing worth keeping across a restart. MQTT does not replay history to late
# subscribers anyway, so a persisted queue would buy nothing and only add state.
persistence false

log_dest stdout
log_type notice

# Makes "did NiFi actually connect?" answerable from `docker logs`. This is how the
# fixed-client-id collision (flows kicking each other off with "session taken over")
# was found in the first place.
connection_messages true

# A demo broker should not be able to absorb unbounded load.
max_connections 100
