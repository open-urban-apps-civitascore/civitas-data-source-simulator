apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: demo
data:
  mosquitto.conf: |
    # (paste broker/mosquitto.conf verbatim — comments included, they carry the reasoning)
    listener 1883
    allow_anonymous true
    persistence false
    log_dest stdout
    log_type notice
    connection_messages true
    max_connections 100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mosquitto
  namespace: demo
spec:
  replicas: 1
  selector: { matchLabels: { app: mosquitto } }
  template:
    metadata: { labels: { app: mosquitto } }
    spec:
      containers:
        - name: mosquitto
          image: eclipse-mosquitto:2
          args: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
          ports: [{ containerPort: 1883 }]
          volumeMounts:
            - { name: config, mountPath: /mosquitto/config, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
      volumes:
        - name: config
          configMap: { name: mosquitto-config }
---
apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: demo
spec:
  selector: { app: mosquitto }
  ports: [{ port: 1883, targetPort: 1883 }]
---
# The database SQL simulations write into, and the platform polls as a source.
# Shipped for the same reason as the broker above: a municipality has neither a
# demo broker nor a demo source table, and asking an operator to supply a
# database address through an install dialog is how wrong addresses get typed.
#
# An operator who already has a database deletes this Deployment, this Service
# and this Secret, and points DEMO_DB_DSN at their own.
apiVersion: v1
kind: Secret
metadata:
  name: demo-source-db
  namespace: demo
type: Opaque
stringData:
  POSTGRES_DB: demo_source
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: change-me
  # The generator reads exactly this one variable; see src/config.ts.
  DEMO_DB_DSN: postgres://demo:change-me@demo-source-db:5432/demo_source
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-source-db
  namespace: demo
spec:
  replicas: 1
  selector: { matchLabels: { app: demo-source-db } }
  template:
    metadata: { labels: { app: demo-source-db } }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          envFrom:
            - secretRef: { name: demo-source-db }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "demo", "-d", "demo_source"] }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
      volumes:
        # Deliberately not a claim: everything here is disposable demo data, and
        # the generator forgets its simulations on restart anyway. Swap in a
        # PersistentVolumeClaim if a demo has to survive a pod restart.
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: demo-source-db
  namespace: demo
spec:
  selector: { app: demo-source-db }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-data-generator
  namespace: demo
spec:
  replicas: 1
  selector: { matchLabels: { app: demo-data-generator } }
  template:
    metadata: { labels: { app: demo-data-generator } }
    spec:
      containers:
        - name: generator
          image: ghcr.io/open-urban-apps-civitascore/demo-data-generator:0.1.0
          ports: [{ containerPort: 4300 }]
          env:
            # dailyProfile peaks are authored in local hours (rush hour 8/17);
            # the container defaults to UTC, which would shift every curve.
            - { name: TZ, value: Europe/Berlin }
            # Without this every SQL simulation fails with "No database configured".
            - name: DEMO_DB_DSN
              valueFrom:
                secretKeyRef: { name: demo-source-db, key: DEMO_DB_DSN }
            - { name: DEMO_BROKER_URL, value: "mqtt://mosquitto:1883" }
            # Every request must carry a Keycloak token from this realm. The
            # service refuses to start if neither this nor SIMULATOR_AUTH_DISABLED
            # is set, so forgetting it cannot leave the API open by accident.
            - name: AUTH_ISSUER_URL
              value: http://keycloak.civitas.svc.cluster.local:8080/realms/civitas-core
            # Optional: also demand a role, once one exists in the realm.
            # - { name: AUTH_REQUIRED_ROLE, value: simulator }
          readinessProbe:
            httpGet: { path: /healthz, port: 4300 }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 192Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: demo-data-generator
  namespace: demo
spec:
  selector: { app: demo-data-generator }
  ports: [{ port: 4300, targetPort: 4300 }]